<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-version" content="units-paper-v6"><title>דרך ויחידה | דף חישוב</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap">
<style>
/*__THEME__*/
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 var(--fb)}
button,input,select{font:inherit;color:inherit}button,a,select{touch-action:manipulation}
button{background:transparent;border:1px solid var(--line);border-radius:6px;min-height:44px;padding:8px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}button:hover{border-color:var(--navy)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--navy);outline-offset:4px}
.primary{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow);font-weight:600}
.quiet{border-color:transparent;color:var(--navy)}a{color:var(--navy)}
.stripe{height:5px;background:linear-gradient(to right,var(--blue) 60%,var(--gray) 60% 80%,var(--yellow) 80%)}
header,.paper,footer,.setup{max-width:1080px;margin:auto;padding:20px 28px}
header{display:flex;justify-content:space-between;gap:14px;align-items:center}
h1{font:500 32px var(--fd);margin:0}h2{font:500 25px/1.45 var(--fd);margin:0}h3{font:500 21px var(--fd)}
.muted,.eyebrow{color:var(--muted);font-size:16px}.eyebrow{margin-bottom:4px}
.setup{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;padding-top:4px;padding-bottom:16px}
.topics{display:flex;gap:16px}.topics button{border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px 2px}
.topics button[aria-pressed=true]{border-bottom-color:var(--navy);color:var(--navy)}.topics small{font-size:14px;color:var(--muted);margin-inline-start:4px}
.choose{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}select{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:8px;max-width:100%;min-width:0;width:350px}
.paper{background:var(--card);padding-top:26px;padding-bottom:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.steps{display:flex;flex-wrap:wrap;gap:16px;list-style:none;margin:20px 0 8px;padding:0;font-size:16px;color:var(--muted)}.steps .current{color:var(--navy);font-weight:600}
.notes{padding-inline-start:24px;margin:8px 0 20px;display:flex;flex-direction:column;gap:4px}.notes li{padding-inline-start:2px}
.stage-title{font-weight:600;margin:16px 0 4px;font-size:19px}.math{font-family:var(--fm);direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-weight:400}
.scroll{direction:ltr;overflow-x:auto;max-width:100%;padding:16px 3px 20px;scrollbar-width:thin}
.equation{direction:ltr;display:flex;align-items:center;gap:.32em;min-width:max-content;font:400 28px/1.4 var(--fm)}
/*__MATH_FONT__*/
.quantity-variable{font-family:'Lesson Math','Cambria Math',serif;font-size:1em;font-weight:400;font-style:italic;direction:ltr;unicode-bidi:isolate}
.quantity-variable[data-symbol="l"]{font-style:normal}
.results,.solution-results{direction:ltr;text-align:left}.result-label{direction:rtl;text-align:left}
.quantity{display:inline-block;white-space:nowrap;direction:ltr;line-height:1.4}
.fraction{display:inline-grid;grid-template-rows:1fr 1fr;text-align:center;vertical-align:middle;flex-shrink:0;line-height:1.4}
.half{padding:.2em .15em;white-space:nowrap;text-align:center;line-height:1.4}.half:first-child{border-bottom:1px solid var(--ink)}
.entry{appearance:none;-webkit-appearance:none;display:inline-block;vertical-align:baseline;box-sizing:border-box;width:var(--fieldw,3em);height:1.85em;min-height:0;padding:.2em .12em;border:0;border-radius:0;background:transparent;color:var(--ink);font:inherit;line-height:1.4;text-align:center;margin:0;caret-color:var(--navy);direction:ltr}
.entry::placeholder{color:var(--muted);opacity:.55}.entry:hover{background:var(--raised)}
.entry.u{cursor:text}.entry.bad{outline:2px solid var(--bad);outline-offset:2px;background:var(--bad-bg)}.entry:focus{outline:2px solid var(--navy);outline-offset:2px;background:var(--cyan-soft)}.entry.bad:focus{outline-color:var(--bad)}
.unit-symbol,.unit-lower{font-size:1em;line-height:inherit;font-style:normal;vertical-align:baseline}.unit-symbol sup{font-size:.62em;line-height:0;vertical-align:super}
.num-static{font-variant-numeric:tabular-nums}.unit{display:inline-block;vertical-align:baseline;position:relative;min-width:1.6em;min-height:44px;border:0;border-radius:0;padding:.12em .18em;background:transparent;font:inherit;line-height:1.4;color:var(--ink);user-select:none;-webkit-user-select:none}
.unit *{pointer-events:none}.unit[disabled]{opacity:1;cursor:default}.unit:hover{background:var(--raised)}.unit:focus-visible{outline-offset:1px}
.color0{color:var(--force)!important;text-decoration:none}
.color1{color:var(--opp)!important;text-decoration:none}
.color2{color:var(--net)!important;text-decoration:none}
.crossed:after{content:'';position:absolute;left:1px;right:1px;top:52%;border-top:2px solid currentColor;transform:rotate(-28deg)}.picked{outline:2px solid var(--navy);outline-offset:1px}
.color-help{font-size:15px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
.bank-wrap{margin:8px 0 18px}.bank-label{font-size:15px;color:var(--muted);margin-bottom:7px}.bank{display:flex;flex-wrap:wrap;gap:8px;direction:ltr}
.tile{font:400 23px/1.4 var(--fm);padding:6px 14px;min-height:46px;min-width:58px;border:1px solid var(--line);border-radius:6px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.tile *{pointer-events:none}.tile.selected{border-color:var(--navy);background:var(--cyan-soft)}
.ghost{position:fixed;z-index:2000;pointer-events:none;transform:translate(-50%,-50%);padding:6px 12px;background:var(--card);border:1px solid var(--navy);font:400 28px var(--fm);direction:ltr}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.actions .spacer{flex:1}.message{margin-top:16px;padding:8px 14px;border-inline-start:3px solid var(--line);font-size:17px;min-height:0}.message ul{padding-inline-start:22px;margin:0}.message strong{display:block}.message.ok{border-color:var(--ok);color:var(--ok-ink)}.message.no{border-color:var(--bad);color:var(--bad-ink)}
.results{margin-top:8px}.result-line{margin:12px 0}.result-label{font-size:15px;color:var(--muted);margin-bottom:3px}.result-line .quantity{font:400 27px/1.4 var(--fm);--fieldw:6em}.result-line:last-child{margin-top:18px}
.help{margin-top:22px;font-size:16px}.help summary{cursor:pointer;color:var(--navy)}.refs{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}.below{max-width:1080px;margin:auto;padding:18px 28px}.quiz{border-bottom:1px solid var(--line);padding-bottom:18px}.quiz summary{cursor:pointer;font-weight:500}.quiz-options{display:grid;gap:8px;margin-top:12px}.quiz-options button{text-align:right}.quiz-options .chosen{background:var(--cyan-soft);border-color:var(--navy)}.quiz-options .wrong{border-color:var(--bad)}
footer{font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;gap:18px;padding-top:10px}
dialog{border:1px solid var(--line);color:var(--ink);background:var(--card);width:calc(100% - 24px);max-width:1040px;max-height:calc(100dvh - 24px);padding:24px;overflow:auto}dialog::backdrop{background:#0008}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.solution-paper{min-height:270px;margin-top:16px}.solution-paper .unit{min-width:0;min-height:0;padding:0 .08em;cursor:default}.solution-paper .unit:hover{background:transparent}.atom{display:inline-block;visibility:hidden}.atom.visible{visibility:visible}.atom.fresh{animation:ink-in .22s ease-out}.factor-latent{visibility:hidden}.solution-results{padding-top:12px}.solution-results .quantity{font:400 28px/1.4 var(--fm)}.solution-result{padding:8px 0}.solution-status{font-size:16px;min-height:2.6em;margin-top:12px;color:var(--muted)}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.stage-bar .stage-title{font-size:24px;line-height:1.4;margin:0}.solution-status{font-size:20px}
dialog.stage-intro{max-width:700px;padding:clamp(28px,6vw,64px);border:0}.stage-intro::backdrop{background:var(--bg)}.stage-intro h2{font-size:clamp(27px,4vw,38px);margin:12px 0}.stage-intro p{font-size:clamp(25px,4vw,34px);line-height:1.55;margin:20px 0 30px}.stage-intro .primary{font-size:23px;min-width:140px}.stage-intro .muted{font-size:17px}
.color-pulse{animation:color-tap .3s ease-out}
@keyframes color-tap{0%{transform:scale(.95)}45%{transform:scale(1.24);background:var(--cyan-soft)}100%{transform:scale(1);background:transparent}}
@keyframes ink-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:620px){header,.setup,.paper,.below,footer{padding-inline:16px}header{padding-top:16px;padding-bottom:16px}h1{font-size:29px}.eyebrow{font-size:14px}.setup{gap:12px}.topics{width:100%;justify-content:space-between;gap:6px}.topics button{font-size:17px}.choose{width:100%}select{flex:1;width:0}.paper{padding-top:20px}h2{font-size:22px}.notes{font-size:16px}.equation{font-size:25px}.steps{gap:11px;font-size:14px}.actions .spacer{display:none}.actions .primary{flex:1}.result-line .quantity{font-size:24px;--fieldw:5.5em}dialog{padding:17px}.dialog-head h2{font-size:21px}.solution-paper{min-height:250px}.solution-paper .equation,.solution-results .quantity{font-size:25px}.tile{font-size:22px}.actions button{font-size:16px;padding:8px 10px}}
</style>
</head>
<body class="unit-calculation">
<div class="stripe"></div>
<header><div><div class="eyebrow">כיתה ז׳ • אורך, שטח וזמן</div><h1>דרך ויחידה</h1></div><button id="theme" class="quiet">ערכה כהה</button></header>
<div class="setup"><nav class="topics" aria-label="נושא התרגול"><button data-topic="length" aria-pressed="true">אורך <small>8 תרגילים</small></button><button data-topic="area" aria-pressed="false">שטח <small>8 תרגילים</small></button><button data-topic="time" aria-pressed="false">זמן <small>8 תרגילים</small></button></nav><label class="choose">תרגיל <select id="exercise"></select></label></div>
<main class="paper">
<h2 id="task-title"></h2>
<ol id="progress" class="steps" aria-label="שלבי הפתרון"></ol>
<div class="stage-bar"><div class="stage-title" id="stage-title"></div><button id="intro-open" class="quiet">הנחיה</button></div><ul class="notes" id="instructions" hidden></ul>
<div id="color-help" hidden></div>
<div class="scroll" id="work-scroll"><div class="equation math" id="work"></div></div>
<div id="results" class="results" hidden></div>
<div id="bank-wrap" class="bank-wrap"><div class="bank-label" id="bank-label"></div><div id="bank" class="bank" aria-label="מאגר מספרים ויחידות"></div></div>
<div class="actions"><button id="back" disabled>חזור</button><button class="primary" id="next">בדיקת השברים והמשך</button><span class="spacer"></span><button class="quiet" id="solution-open">פתרון מדורג</button><button class="quiet" id="reset">התחלה מחדש</button></div>
<div id="feedback" class="message" role="status" aria-live="polite" hidden></div>
<details class="help"><summary>יחסי המרה ועזרה</summary><ul class="notes"><li id="topic-note"></li><li id="route-note"></li></ul><div id="references" class="refs math"></div></details>
</main>
<div class="below"><details class="quiz" id="quiz"><summary>שאלת הבנה: למה פותרים כך?</summary><div class="muted" id="quiz-count"></div><h3 id="quiz-question"></h3><div id="quiz-options" class="quiz-options"></div><div id="quiz-feedback" class="message" role="status" aria-live="polite" hidden></div><button id="quiz-next" class="quiet">שאלה נוספת</button></details></div>
<footer><a href="with-skill.html" download="derech-veyachida.html">הורדת קובץ HTML</a><span>24 תרגילים, 8 בכל נושא</span></footer>
<dialog id="solution" aria-labelledby="solution-title"><div class="dialog-head"><h2 id="solution-title">פתרון על הדף, צעד אחר צעד</h2><button id="solution-close" class="quiet">סגירה</button></div><div id="solution-counter" class="muted"></div><div class="solution-paper"><div class="scroll" id="solution-scroll"><div id="solution-work" class="equation math"></div></div><div class="solution-results" id="solution-results"></div></div><div class="solution-status" id="solution-status" aria-live="polite"></div><div class="actions"><button id="solution-prev">חזור</button><button class="primary" id="solution-next">הצעד הבא</button><button id="solution-play" class="quiet" aria-pressed="false">נגינה</button><button id="solution-reset" class="quiet">מההתחלה</button></div></dialog>
<dialog id="stage-intro" class="stage-intro" aria-labelledby="intro-title" aria-describedby="intro-text"><div class="muted" id="intro-count"></div><h2 id="intro-title"></h2><p id="intro-text"></p><button id="intro-continue" class="primary">המשך</button></dialog>
<script>/*__CORE__*/</script>
<script>/*__UNITS__*/</script>
<script>
'use strict';
const C=Conversions,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const colorNames=['כתום','כחול','ירוק'],stepNames=['הצבה','סימון בצבע','צמצום','חישוב'];
let topic='length',g,e,q,p,t,vals,marks,resultValues,phase=0,built=false,colorsOK=false,cancelled=new Set(),first=null,selected=null,drag=null,suppressClick=false,quizIndex=0,quiz=[],solIndex=0,solStates=[],timer=null,introSeen=new Set();
const fmt=n=>Number(n.toPrecision(12)).toLocaleString('en-US',{maximumFractionDigits:10});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uh=u=>renderUnit(u).outerHTML;
const qs=()=>q.symbol==='l'?'ℓ':q.symbol;
const qh=()=>`<var class="quantity-variable" data-symbol="${q.symbol}" aria-label="${esc(q.name)}, ${q.symbol}" title="${esc(q.name)}" dir="ltr">${q.symbol==='l'?'ℓ':q.symbol}</var>`;
function message(id,kind,items){const box=$('#'+id);box.hidden=!items.length;box.className='message '+kind;box.replaceChildren();if(kind){const b=document.createElement('strong');b.textContent=kind==='ok'?'✓ נכון':'✗ לא נכון';box.append(b)}const ul=document.createElement('ul');for(const s of items){const li=document.createElement('li');li.textContent=s;ul.append(li)}box.append(ul)}
function clearCalc(){resultValues=p.map(()=>({n:'',u:''}))}
function invalidate(){built=false;colorsOK=false;marks=t.map(()=>null);cancelled.clear();first=null;clearCalc()}
function reset(){drag?.ghost?.remove();drag=null;pause();if($('#solution').open)$('#solution').close();g=C.groups[topic];q=C.quantity(g,+$('#exercise').value||0);e=g.exercises[+$('#exercise').value||0];p=C.path(g,e);t=C.terms(e,p);vals=p.map(()=>({n:'',d:'',nu:'',du:''}));marks=t.map(()=>null);built=false;colorsOK=false;cancelled.clear();first=null;selected=null;phase=0;clearCalc();$('#task-title').textContent=`${q.name}: המירו ${fmt(e[0])} ${g.names[e[1]]} ל${g.names[e[2]]}`;$('#topic-note').textContent=g.note+' '+(topic==='area'?'S ו־A הם שני סימונים לשטח. ':'')+qs()+' מסמן '+q.name+'.';$('#route-note').textContent='מסלול התרגיל: '+[e[1],...p.map(x=>x.to)].map(u=>g.names[u]).join(', אחר כך ');$('#references').innerHTML=g.reference.map(s=>`<span>${esc(s)}</span>`).join('');quizIndex=(+$('#exercise').value||0)%questions().length;$('#quiz').open=false;renderQuiz();renderPhase()}
function field(i,key,unit=false,result=false){const value=result?resultValues[i][key]:vals[i][key];const attrs=result?`data-result="${i}" data-key="${key}"`:`data-i="${i}" data-key="${key}"`;const label=result?`${unit?'יחידה':'מספר'} ${i===p.length-1?'בתוצאה הסופית':'בשלב הביניים '+(i+1)}`:`שבר ${i+1}, ${unit?'יחידה':'מספר'} ב${key[0]==='n'?'מונה':'מכנה'}`;return `<input type="text" class="entry${unit?' u':''}" inputmode="${unit?'text':'decimal'}" ${attrs} aria-label="${label}" placeholder="${unit?'?':'…'}" autocomplete="off" autocapitalize="off" spellcheck="false" dir="ltr" value="${esc(value)}">`}
function term(id){const x=t[id],c=marks[id],cross=phase>=2&&cancelled.has(id);const label=`${x.u}, ${x.side==='top'?'מונה':'מכנה'}, ${c==null?'ללא צבע':colorNames[c]}${cross?', צומצמה':''}`;return `<button class="unit ${c==null?'':'color'+c} ${cross?'crossed':''} ${first===id?'picked':''}" data-term="${id}" aria-label="${label}" title="${c==null?'ללא צבע':colorNames[c]}" ${cross||phase===3?'disabled':''}>${uh(x.u)}</button>`}
function workHTML(){const given=phase===0?`<span class="quantity">${fmt(e[0])} ${uh(e[1])}</span>`:`<span class="quantity">${fmt(e[0])} ${term(0)}</span>`;return qh()+'<span>=</span>'+given+p.map((x,i)=>`<span>×</span><div class="fraction" aria-label="שבר המרה ${i+1}"><div class="half"><span class="quantity">${phase===0?field(i,'n')+' '+field(i,'nu',true):fmt(C.number(vals[i].n))+' '+term(1+i*2)}</span></div><div class="half"><span class="quantity">${phase===0?field(i,'d')+' '+field(i,'du',true):fmt(C.number(vals[i].d))+' '+term(2+i*2)}</span></div></div>`).join('')}
function renderPhase(){message('feedback','',[]);$('#progress').innerHTML=stepNames.map((name,i)=>`<li class="${i===phase?'current':''}" ${i===phase?'aria-current="step"':''}>${i+1}. ${name}</li>`).join('');$('#stage-title').textContent=`שלב ${phase+1}: ${['בנו את שברי ההמרה','סמנו זוגות לפני הצמצום','צמצמו את הזוגות שסימנתם','השלימו את החישוב'][phase]}`;$('#instructions').hidden=true;$('#color-help').hidden=true;$('#back').disabled=phase===0;$('#next').textContent=['בדיקת השברים והמשך','בדיקת הצבעים והמשך','המשך לחישוב','בדיקת החישוב'][phase];const digits=Math.max(...p.map(x=>String(Math.max(x.n,x.d)).length));$('#work').style.setProperty('--fieldw',Math.max(2.9,digits*.6+.5)+'em');$('#work').innerHTML=workHTML();$('#work-scroll').scrollLeft=0;$('#results').hidden=phase!==3;$('#results').innerHTML=phase===3?p.map((x,i)=>`<div class="result-line"><div class="result-label">${i===p.length-1?'תוצאה סופית':'לאחר ההמרה ל'+g.names[x.to]}</div><div class="quantity math">${qh()} = ${field(i,'n',false,true)} ${field(i,'u',true,true)}</div></div>`).join(''):'';$('#bank-wrap').hidden=phase===1||phase===2;if(phase===0||phase===3)renderBank();if(!introSeen.has(phase))showPhaseIntro();else if(phase===1||phase===2)focusFirstTerm()}
function renderBank(){const items=[...(phase===0?[...new Set([1,...p.flatMap(x=>[x.n,x.d])])].map(v=>({type:'n',v:String(v)})):[]),...g.order.map(v=>({type:'u',v}))];$('#bank-label').textContent='גרירה, לבחירתכם';$('#bank').innerHTML=items.map(x=>`<button class="tile ${selected?.type===x.type&&selected?.v===x.v?'selected':''}" data-type="${x.type}" data-value="${x.v}" aria-label="מאגר: ${x.type==='n'?'מספר':'יחידה'} ${x.v}" aria-pressed="${selected?.type===x.type&&selected?.v===x.v}">${x.type==='u'?uh(x.v):x.v}</button>`).join('')}
function place(el,token){if(!el||!token)return;const isUnit=el.classList.contains('u');if((token.type==='u')!==isUnit){message('feedback','no',[isUnit?'כאן מציבים סמל יחידה.':'כאן מציבים מספר.']);return}storeEntry(el,token.v);el.value=token.v;el.classList.remove('bad');selected=null;renderBank();message('feedback','',[])}
function storeEntry(el,value){if(el.dataset.result!==undefined)resultValues[+el.dataset.result][el.dataset.key]=value;else{vals[+el.dataset.i][el.dataset.key]=value;invalidate()}}
function commitUnit(el){if(!el?.classList.contains('u'))return;const symbol=C.unitSymbol(el.value,g.order);if(symbol&&symbol!==el.value){storeEntry(el,symbol);el.value=symbol}}
function commitEntries(){for(const el of $$('.entry.u'))commitUnit(el)}
document.addEventListener('focusout',ev=>{if(ev.target.matches('.entry.u'))commitUnit(ev.target)});
document.addEventListener('input',ev=>{const el=ev.target;if(!el.matches('input.entry'))return;selected=null;for(const tile of $$('.tile.selected')){tile.classList.remove('selected');tile.setAttribute('aria-pressed','false')}storeEntry(el,el.value);el.classList.remove('bad');message('feedback','',[])});
document.addEventListener('click',ev=>{if(suppressClick)return;const tile=ev.target.closest('.tile');if(tile){selected={type:tile.dataset.type,v:tile.dataset.value};renderBank();$('#bank [data-type="'+selected.type+'"][data-value="'+selected.v+'"]').focus();return}const entry=ev.target.closest('.entry');if(entry&&selected){if(entry.classList.contains('u')===(selected.type==='u'))place(entry,selected);else{selected=null;renderBank()}}});
function focusEntry(el,direction){if(!el)return;el.focus({preventScroll:true});if(direction==='ArrowRight')el.setSelectionRange(0,0);else if(direction==='ArrowLeft')el.setSelectionRange(el.value.length,el.value.length);else el.select();el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'})}
document.addEventListener('keydown',ev=>{const el=ev.target.closest('input.entry');if(!el||ev.isComposing||ev.ctrlKey||ev.metaKey||ev.altKey||ev.shiftKey)return;if(ev.key==='Enter'){ev.preventDefault();commitUnit(el);const entries=$$('.entry'),i=entries.indexOf(el);if(i<entries.length-1)focusEntry(entries[i+1],'Enter');else $('#next').focus();return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key))return;if(ev.key==='ArrowLeft'&&(el.selectionStart!==0||el.selectionEnd!==0))return;if(ev.key==='ArrowRight'&&(el.selectionStart!==el.value.length||el.selectionEnd!==el.value.length))return;ev.preventDefault();const cell={scope:el.dataset.result!==undefined?'result':'factor',index:+(el.dataset.result??el.dataset.i),key:el.dataset.key};const target=C.keyboardTarget(cell,ev.key,p.length);if(!target)return;commitUnit(el);const selector=target.scope==='result'?`[data-result="${target.index}"][data-key="${target.key}"]`:`[data-i="${target.index}"][data-key="${target.key}"]`;focusEntry($(selector),ev.key)});
function focusTerm(id){const button=$(`#work [data-term="${id}"]:not([disabled])`);if(!button)return;button.focus({preventScroll:true});button.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'})}
function focusFirstTerm(){const first=$('#work [data-term]:not([disabled])');if(first)focusTerm(+first.dataset.term);else $('#next').focus()}
$('#work').addEventListener('keydown',ev=>{const button=ev.target.closest('[data-term]');if(!button||!(phase===1||phase===2)||ev.isComposing||ev.ctrlKey||ev.metaKey||ev.altKey||ev.shiftKey)return;if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(ev.key))return;ev.preventDefault();const id=+button.dataset.term,enabled=$$('#work [data-term]:not([disabled])').map(b=>+b.dataset.term),row=enabled.filter(i=>t[i].side===t[id].side);let target;if(ev.key==='Home')target=enabled[0];else if(ev.key==='End')target=enabled.at(-1);else if(ev.key==='ArrowUp'&&t[id].side==='bottom')target=id-1;else if(ev.key==='ArrowDown'&&t[id].side==='top')target=id===0?2:id+1;else if(ev.key==='ArrowRight')target=row[row.indexOf(id)+1];else if(ev.key==='ArrowLeft')target=row[row.indexOf(id)-1]??(t[id].side==='bottom'?0:undefined);if(target!==undefined)focusTerm(target)});
$('#work').addEventListener('click',ev=>{const b=ev.target.closest('[data-term]');if(!b)return;const id=+b.dataset.term;if(phase===1){marks[id]=C.cycleColor(marks[id]);colorsOK=false;cancelled.clear();first=null;clearCalc();$('#work').innerHTML=workHTML();const painted=$('#work').querySelector(`[data-term="${id}"]`);painted.classList.add('color-pulse');painted.addEventListener('animationend',()=>painted.classList.remove('color-pulse'),{once:true});painted.focus();message('feedback','',[])}else if(phase===2){if(first===id){first=null;b.classList.remove('picked');return}if(first==null){first=id;b.classList.add('picked');message('feedback','',['בחרו עכשיו את בת הזוג באותו צבע.']);return}if(!C.canCancel(t,marks,first,id)){message('feedback','no',['בדקו שיש אותו סמל יחידה באותו צבע, אחד במונה ואחד במכנה.']);return}cancelled.add(first);cancelled.add(id);first=null;$('#work').innerHTML=workHTML();message('feedback','ok',[cancelled.size===p.length*2?`כל הזוגות צומצמו. ${e[2]} נשארה במונה. המשיכו לחישוב.`:'הזוג צומצם. המשיכו לזוג הבא.'])}});
function checkBuild(){commitEntries();for(const b of $$('#work .entry'))b.classList.remove('bad');for(let i=0;i<p.length;i++){const v=vals[i],x=p[i];let key,text;for(const k of ['n','nu','d','du'])if(!v[k]){key=k;text=`בשבר ${i+1} חסר ${k.length===1?'מספר':'סמל יחידה'} ב${k[0]==='n'?'מונה':'מכנה'}.`;break}if(!text&&v.du!==x.from){key='du';text=`בשבר ${i+1}, בדקו איזו יחידה צריך להציב במכנה כדי לצמצם את היחידה הקודמת.`}if(!text&&v.nu!==x.to){key='nu';text=`בשבר ${i+1}, בדקו לאיזו יחידה עוברים. היא צריכה להופיע במונה.`}if(!text&&(!C.close(C.number(v.n)/C.number(v.d),x.n/x.d)||C.number(v.d)<=0)){key='n';text=`בשבר ${i+1}, יחס המספרים אינו מתאים ליחידות. היעזרו ביחסי ההמרה.`}if(text){const el=$(`[data-i="${i}"][data-key="${key}"]`);el.classList.add('bad');el.focus();message('feedback','no',[text]);return false}}built=true;return true}
function checkColors(){const err=C.colorError(t,marks,p.length);if(!err){colorsOK=true;return true}const name=err.color==null?'':colorNames[err.color];const msg=err.kind==='count'?`בצבע ${name}, סמנו בדיוק שתי יחידות.`:err.kind==='unit'?`היחידות שסימנתם בצבע ${name} שונות. צבע זהה אינו מספיק כדי לצמצם.`:err.kind==='side'?`בצבע ${name}, צריך יחידה אחת במונה ואחת במכנה.`:err.kind==='remaining'?'השאירו את יחידת היעד במונה ללא צבע.':'סמנו כל זוג מתאים בצבע אחר. יחידת היעד צריכה להישאר ללא צבע.';message('feedback','no',[msg]);return false}
function checkCalc(){commitEntries();let r=e[0];for(let i=0;i<p.length;i++){r*=C.number(vals[i].n)/C.number(vals[i].d);const v=resultValues[i];if(!C.close(C.number(v.n),r)){message('feedback','no',[`בדקו את המספר בשורה ${i+1}. הכפילו במונה וחלקו במכנה של ההמרה המתאימה.`]);$(`[data-result="${i}"][data-key="n"]`).focus();return}if(v.u!==p[i].to){message('feedback','no',[`בדקו איזו יחידה נשארת בשורה ${i+1}.`]);$(`[data-result="${i}"][data-key="u"]`).focus();return}}message('feedback','ok',[`${qs()} = ${fmt(e[0])} ${e[1]} = ${fmt(C.answer(g,e))} ${e[2]}`,'הגודל נשמר. רק היחידה והערך המספרי השתנו.']);$('#quiz').open=true}
$('#next').onclick=()=>{if(phase===0){if(!checkBuild())return;phase=1;renderPhase()}else if(phase===1){if(!checkColors())return;phase=2;renderPhase()}else if(phase===2){if(cancelled.size!==p.length*2){message('feedback','no',['צמצמו תחילה את כל זוגות היחידות שסימנתם.']);return}phase=3;selected=null;renderPhase()}else checkCalc()};
$('#back').onclick=()=>{if(phase>0){phase--;first=null;selected=null;renderPhase()}};

function renderQuiz(){quiz=questions();quizIndex%=quiz.length;const q=quiz[quizIndex];$('#quiz-count').textContent=`שאלה ${quizIndex+1} מתוך ${quiz.length}`;$('#quiz-question').textContent=q.q;$('#quiz-options').innerHTML=q.o.map((s,i)=>`<button data-answer="${i}">${s}</button>`).join('');message('quiz-feedback','',[])}
$('#quiz-options').onclick=ev=>{const b=ev.target.closest('[data-answer]');if(!b)return;const i=+b.dataset.answer,q=quiz[quizIndex];$$('#quiz-options button').forEach(x=>x.classList.remove('chosen','wrong'));b.classList.add(i===q.a?'chosen':'wrong');message('quiz-feedback',i===q.a?'ok':'no',[q.f[i]])};$('#quiz-next').onclick=()=>{quizIndex=(quizIndex+1)%quiz.length;renderQuiz()};
function selectTopic(key){topic=key;g=C.groups[key];$$('[data-topic]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.topic===key)));$('#exercise').innerHTML=g.exercises.map((x,i)=>`<option value="${i}">${i+1}. ${C.quantity(g,i).name}: ${fmt(x[0])} ${g.names[x[1]]} ל${g.names[x[2]]}</option>`).join('');reset()}
$$('[data-topic]').forEach(b=>b.onclick=()=>selectTopic(b.dataset.topic));$('#exercise').onchange=reset;$('#reset').onclick=reset;
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('#theme').textContent=dark?'ערכה בהירה':'ערכה כהה';try{localStorage.setItem('data-theme',dark?'dark':'light')}catch{}}let saved;try{saved=localStorage.getItem('data-theme')}catch{}setTheme(saved?saved==='dark':matchMedia('(prefers-color-scheme:dark)').matches);$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');
// One pointer lifecycle for mouse and touch. Tapping remains a separate fallback.
document.addEventListener('dragstart',ev=>{if(ev.target.closest('.tile'))ev.preventDefault()});
document.addEventListener('pointerdown',ev=>{const b=ev.target.closest('.tile');if(!b||ev.button!==0)return;drag={x:ev.clientX,y:ev.clientY,b,token:{type:b.dataset.type,v:b.dataset.value},ghost:null};try{b.setPointerCapture(ev.pointerId)}catch{}});
document.addEventListener('pointermove',ev=>{if(!drag)return;if(!drag.ghost&&Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)>8){drag.ghost=document.createElement('div');drag.ghost.className='ghost';drag.ghost.innerHTML=drag.token.type==='u'?uh(drag.token.v):drag.token.v;document.body.append(drag.ghost)}if(drag.ghost){drag.ghost.style.left=ev.clientX+'px';drag.ghost.style.top=ev.clientY+'px'}});
document.addEventListener('pointerup',ev=>{if(!drag)return;const d=drag;drag=null;if(!d.ghost)return;d.ghost.remove();suppressClick=true;setTimeout(()=>suppressClick=false,0);const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.entry');if(el)place(el,d.token)});
document.addEventListener('pointercancel',()=>{drag?.ghost?.remove();drag=null});
function pause(){if(timer)clearTimeout(timer);timer=null;$('#solution-play').textContent='נגינה';$('#solution-play').setAttribute('aria-pressed','false')}
function atom(id,text,visible,fresh,unit=false){return `<span class="atom ${visible.has(id)?'visible':''} ${fresh===id?'fresh':''}" data-atom="${id}">${unit?uh(text):text}</span>`}
function renderSolution(){const states=solStates.slice(0,solIndex+1),current=solStates[solIndex],written=new Set(states.filter(s=>s.kind==='quantity'||s.kind==='write'||s.kind==='calculate').map(s=>s.id)),painted=new Map(),crossed=new Set();for(const s of states){if(s.kind==='mark')painted.set(s.term,s.pair);if(s.kind==='cancel'){crossed.add(s.pair===0?0:1+(s.pair-1)*2);crossed.add(2+s.pair*2)}}const fresh=current.id||'';const su=(id,atomId,u)=>{const pair=painted.get(id),color=pair==null?null:colorsOK?marks[id]:pair;return `<span class="unit ${color==null?'':'color'+color} ${crossed.has(id)?'crossed':''}">${atom(atomId,u,written,fresh,true)}</span>`};$('#solution-work').innerHTML=`${atom('quantity',qh()+' =',written,fresh)}<span class="quantity">${atom('given-n',fmt(e[0]),written,fresh)} ${su(0,'given-u',e[1])}</span>`+p.map((x,i)=>`<span class="${written.has('f'+i+'-n')?'':'factor-latent'}">×</span><span class="fraction ${written.has('f'+i+'-n')?'':'factor-latent'}"><span class="half"><span class="quantity">${atom('f'+i+'-n',fmt(x.n),written,fresh)} ${su(1+i*2,'f'+i+'-nu',x.to)}</span></span><span class="half"><span class="quantity">${atom('f'+i+'-d',fmt(x.d),written,fresh)} ${su(2+i*2,'f'+i+'-du',x.from)}</span></span></span>`).join('');let r=e[0];$('#solution-results').innerHTML=p.map((x,i)=>{r*=x.n/x.d;return `<div class="solution-result ${written.has('r'+i+'-n')?'':'factor-latent'}"><span class="quantity math">${qh()} = ${atom('r'+i+'-n',fmt(r),written,fresh)} ${atom('r'+i+'-u',x.to,written,fresh,true)}</span></div>`}).join('');let description;if(current.kind==='quantity'){description=qs()+' מסמן '+q.name+'.'}else if(current.kind==='write'){description=current.id==='given-n'?'כותבים את המספר הנתון.':current.id==='given-u'?'מוסיפים יחידת מידה.':current.id.endsWith('-nu')?'מציבים יחידה במונה.':current.id.endsWith('-du')?'מציבים יחידה במכנה.':current.id.endsWith('-n')?'מציבים מספר במונה.':'מציבים מספר במכנה.'}else if(current.kind==='mark'){description='מסמנים זוג באותו צבע.'}else if(current.kind==='cancel'){description='מצמצמים יחידות. המספרים נשארים.'}else description=current.id.endsWith('-n')?'מחשבים את הערך.':'משלימים את היחידה שנותרה.';$('#solution-status').textContent=description;$('#solution-counter').textContent=`צעד ${solIndex+1} מתוך ${solStates.length}`;$('#solution-prev').disabled=solIndex===0;$('#solution-next').disabled=solIndex===solStates.length-1;if(solIndex===solStates.length-1)pause();const focus=$('#solution-work .fresh');if(focus)focus.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'})}
function tick(){timer=setTimeout(()=>{if(!$('#solution').open){pause();return}if(solIndex<solStates.length-1){solIndex++;renderSolution();if(solIndex<solStates.length-1)tick()}},950)}
$('#solution-open').onclick=()=>{pause();solStates=C.revealAtoms(p);solIndex=0;renderSolution();$('#solution').showModal();$('#solution-next').focus()};$('#solution-close').onclick=()=>$('#solution').close();$('#solution').addEventListener('close',pause);$('#solution-next').onclick=()=>{pause();if(solIndex<solStates.length-1){solIndex++;renderSolution()}};$('#solution-prev').onclick=()=>{pause();if(solIndex>0){solIndex--;renderSolution()}};$('#solution-reset').onclick=()=>{pause();solIndex=0;renderSolution()};$('#solution-play').onclick=()=>{if(timer){pause();return}if(solIndex===solStates.length-1)solIndex=0;renderSolution();$('#solution-play').textContent='השהיה';$('#solution-play').setAttribute('aria-pressed','true');tick()};
const introText=['השלימו את שברי ההמרה.','סמנו כל זוג באותו צבע.','צמצמו את הזוגות שסימנתם.','השלימו מספר ויחידה.'];

$('#intro-continue').onclick=()=>{introSeen.add(phase);$('#stage-intro').close();const first=$('.entry')||$('#work .unit:not([disabled])');if(first){first.focus();if(first.tagName==='INPUT')first.select()}};
