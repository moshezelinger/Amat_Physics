<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>כוחות וכוח שקול | מצגת לכיתה ח׳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600&family=Assistant:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#03060b;color:#f2fbff;font:20px 'Assistant',Arial,sans-serif;height:100dvh;display:flex;flex-direction:column}button,select,a{font:inherit}button,select{border:1px solid #1f4450;border-radius:6px;background:#13222c;color:#f2fbff;padding:7px 12px;min-height:42px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #00d4f2;outline-offset:3px}a{color:#3fe0f8;text-underline-offset:4px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #1f4450}.toolbar label{font-weight:700}select{max-width:min(360px,60vw)}.links{margin-inline-start:auto;display:flex;gap:16px;align-items:center}.controls .links{margin-inline-start:24px}.primary{background:#00d4f2;color:#03060b;border-color:#00d4f2}.controls{justify-content:center;border-top:1px solid #1f4450;border-bottom:0;padding:6px 12px}.status{min-width:165px;text-align:center;font-variant-numeric:tabular-nums}#viewport{flex:1;min-height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2px}#screen{position:relative;flex:none;direction:ltr}iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:top left;background:#03060b}.help{font-size:17px;color:#9db0b8;margin:8px 0 0}details{background:#0b141b;border-top:1px solid #1f4450;padding:4px 18px}summary{cursor:pointer;color:#3fe0f8}#notes{white-space:pre-wrap;max-height:24dvh;overflow:auto;margin:8px 0;font-size:19px}#reset[hidden]{display:none}@media(max-width:650px){body{font-size:17px}.toolbar{gap:6px;padding:7px 10px}.links{gap:10px}.help{font-size:15px}.status{min-width:130px}button{padding:6px 9px}.links a:first-child{display:none}}@media(prefers-reduced-motion:no-preference){iframe{transition:opacity .12s}}
</style>
</head>
<body>
<main id="viewport"><div id="screen"><iframe id="slideFrame" title="תוכן השקף"></iframe></div></main>
<footer class="toolbar controls"><select id="slideSelect" aria-label="בחירת שקף"></select><button id="previous" type="button">הקודם</button><span id="status" class="status" role="status" aria-live="polite"></span><button id="next" class="primary" type="button" title="אפשר גם במקש רווח">הבא</button><button id="reveal" type="button">הצגת כל השקף</button><button id="reset" type="button" hidden>התחלה מחדש</button><div class="links"><a href="../">דף פתיחה</a><a href="../forces-lab/" target="_blank" rel="noopener">ללומדה</a><button id="fullscreen" type="button">מסך מלא</button></div></footer>
<details id="teacherNotes"><summary>הערות למורה</summary><p class="help">התקדמו בכפתור "הבא" או במקש רווח. מקשי החצים עוברים בין שלבי ההסבר.</p><p id="notes"></p></details>
<script type="application/json" id="slideData"><!-- SLIDE_DATA --></script>
<script>
'use strict';
const slides=JSON.parse(document.getElementById('slideData').textContent);
const $=id=>document.getElementById(id),frame=$('slideFrame'),select=$('slideSelect');
let index=0,step=0,ready=false,shownStep=0;
const svgNS='http://www.w3.org/2000/svg';
slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.title}`;select.appendChild(o)});
function resize(){const box=$('viewport'),scale=Math.min((box.clientWidth-4)/1920,(box.clientHeight-4)/1080);$('screen').style.width=1920*scale+'px';$('screen').style.height=1080*scale+'px';frame.style.transform=`scale(${scale})`}
new ResizeObserver(resize).observe($('viewport'));
function apply(){if(!ready)return;const doc=frame.contentDocument,forward=step>shownStep;doc.querySelectorAll('[data-build-in],[data-build-out]').forEach(el=>{const n=a=>{const value=el.getAttribute(a);return value?Number(value.trim().split(/\s+/).at(-1)):null};const start=n('data-build-in')||0,end=n('data-build-out'),show=step>=start&&(end===null||step<end),was=el.style.visibility==='visible';el.style.visibility=show?'visible':'hidden';if(show&&!was&&forward){el.classList.remove('rise');void el.getBoundingClientRect();el.classList.add('rise')}});shownStep=step;update()}
function update(){select.value=String(index);$('status').textContent=`${index+1}/${slides.length} · שלב ${step}/${slides[index].steps}`;$('status').setAttribute('aria-label',`שקף ${index+1} מתוך ${slides.length}, שלב ${step} מתוך ${slides[index].steps}`);$('previous').disabled=index===0&&step===0;$('next').disabled=index===slides.length-1&&step===slides[index].steps;$('reveal').disabled=step===slides[index].steps;$('notes').textContent=slides[index].notes;$('reset').hidden=!slides[index].id.startsWith('w');history.replaceState(null,'',`#slide=${slides[index].id}&step=${step}`)}
function connector(el){const doc=el.ownerDocument,svg=doc.createElementNS(svgNS,'svg');svg.setAttribute('width','1920');svg.setAttribute('height','1080');svg.style.cssText='position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;overflow:visible';for(const a of ['id','data-build-in','data-build-out','data-drag'])if(el.hasAttribute(a))svg.setAttribute(a,el.getAttribute(a));const x1=+el.getAttribute('x1'),y1=+el.getAttribute('y1'),x2=+el.getAttribute('x2'),y2=+el.getAttribute('y2'),color=el.style.color||'#f2fbff',w=parseFloat(el.style.borderWidth)||2,L=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(4*w,L*.6),head=el.getAttribute('head')!=='none';const line=doc.createElementNS(svgNS,'line');for(const [k,v]of Object.entries({x1,y1,x2:head?x2-ux*h*.8:x2,y2:head?y2-uy*h*.8:y2,stroke:color,'stroke-width':w,'stroke-linecap':'round'}))line.setAttribute(k,v);if(el.style.borderStyle==='dashed')line.setAttribute('stroke-dasharray','12 10');svg.appendChild(line);if(head){const p=doc.createElementNS(svgNS,'polygon');p.setAttribute('points',`${x2},${y2} ${x2-ux*h-uy*h*.5},${y2-uy*h+ux*h*.5} ${x2-ux*h+uy*h*.5},${y2-uy*h-ux*h*.5}`);p.setAttribute('fill',color);svg.appendChild(p)}el.replaceWith(svg)}
function setupDrag(doc){let drag=null;const history=[];doc.querySelectorAll('[data-drag]').forEach(el=>{el.classList.add('draggable');el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',el.textContent.trim()||'חץ לגרירה');el.addEventListener('pointerdown',e=>{if(e.button!==0)return;const original=el.style.transform;drag={el,x:e.clientX,y:e.clientY,original};el.setPointerCapture(e.pointerId);e.preventDefault();e.stopPropagation()});el.addEventListener('pointermove',e=>{if(!drag||drag.el!==el)return;el.style.transform=`translate(${e.clientX-drag.x}px,${e.clientY-drag.y}px) ${drag.original}`});el.addEventListener('pointerup',e=>{if(!drag||drag.el!==el)return;history.push({el,original:drag.original});drag=null;e.stopPropagation()});el.addEventListener('pointercancel',()=>{if(drag){drag.el.style.transform=drag.original;drag=null}});el.addEventListener('keydown',e=>{const moves={ArrowLeft:[-10,0],ArrowRight:[10,0],ArrowUp:[0,-10],ArrowDown:[0,10]};if(moves[e.key]){e.preventDefault();e.stopPropagation();const original=el.style.transform;history.push({el,original});const [x,y]=moves[e.key];el.style.transform=`translate(${x}px,${y}px) ${original}`}})});doc.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&history.length){e.preventDefault();e.stopImmediatePropagation();const last=history.pop();last.el.style.transform=last.original}})}
function openSlide(n,start=0){index=Math.max(0,Math.min(slides.length-1,n));step=Math.max(0,Math.min(slides[index].steps,start));ready=false;frame.style.opacity='0';const base=new URL('./',location.href).href;const content=slides[index].html;frame.onload=()=>{const doc=frame.contentDocument;doc.querySelectorAll('x-connector').forEach(connector);doc.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener'});setupDrag(doc);doc.addEventListener('keydown',keys);doc.addEventListener('click',e=>{if(!e.target.closest('a,button,[data-drag],canvas'))next()});ready=true;shownStep=step;apply();const sec=doc.querySelector('section');if(sec)sec.classList.add('enter');frame.style.opacity='1';resize()};frame.srcdoc='<!doctype html><html lang="he"><head><meta charset="utf-8"><base href="'+base+'"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&family=Rubik:wght@500;600;700&family=Assistant:wght@400;600;700"><style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden}p,h1,h2,h3{margin:0}section{position:relative;width:1920px;height:1080px;box-sizing:border-box;overflow:hidden}section *{box-sizing:border-box}x-embed{display:block}[data-build-in]{visibility:hidden}.draggable{cursor:grab;touch-action:none;user-select:none}.draggable:focus-visible{outline:3px solid #00d4f2}.draggable line,.draggable polygon{pointer-events:visiblePainted}@keyframes rise{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}@keyframes enter{from{opacity:.4;translate:0 10px}to{opacity:1;translate:0 0}}.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}section.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}@media (prefers-reduced-motion:reduce){.rise,section.enter{animation:none}}</style></head><body>'+content+'</bo'+'dy></html>';update()}
function next(){if(!ready)return;if(step<slides[index].steps){step++;apply()}else if(index<slides.length-1)openSlide(index+1)}
function previous(){if(!ready)return;if(step>0){step--;apply()}else if(index>0)openSlide(index-1,slides[index-1].steps)}
function keys(e){if(e.defaultPrevented||e.ctrlKey||e.metaKey||e.altKey||/^(SELECT|INPUT|BUTTON|TEXTAREA)$/.test(e.target.tagName))return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();previous()}else if(e.key==='Home'){e.preventDefault();openSlide(0)}else if(e.key==='End'){e.preventDefault();openSlide(slides.length-1,slides.at(-1).steps)}}
function readHash(){const p=new URLSearchParams(location.hash.slice(1)),id=p.get('slide'),n=slides.findIndex(s=>s.id===id);openSlide(n<0?0:n,Number(p.get('step'))||0)}
$('next').onclick=next;$('previous').onclick=previous;$('reveal').onclick=()=>{step=slides[index].steps;apply()};$('reset').onclick=()=>openSlide(index,step);select.onchange=()=>openSlide(Number(select.value));$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};document.addEventListener('keydown',keys);window.addEventListener('hashchange',readHash);readHash();
</script>
</body>
</html>
