35;כוח מנוגד&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;right:442px;bottom:58px;width:170px;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#007a5a;border-radius:9999px;padding:2px 0\"\u003e&#8235;כוח שקול&#8236;\u003c/p\u003e\n\n\u003c/section\u003e\n\n", "notes": "מטרה: לעורר הבחנה בין שלושה מצבים, בלי לפתור אותם.\nפונים לתלמידים: \"התבוננו בכל ציור וענו בקול\".\nסדר ההקשות: הקשות 1 עד 3: כל מצב מופיע לחוד. אחרי כל אחד שואלים: על כמה גופים פועלים הכוחות בכל ציור? מה הערך של כל כוח? הקשה 4: מסכמים את התשובות על כל ציור. הקשה 5: שואלים אם בכל הציורים הכוחות פועלים על אותו גוף. מצביעים בלי לחשוף תשובה. רושמים על הלוח כמה הצביעו לכל אפשרות. הקשה 6: מטרת השיעור.\nבמצב 1 שני הגופים נוגעים זה בזה, וכל חץ מצויר על גוף אחר. במצבים 2 ו-3 שני החצים על אותו גוף. הסימון 1,2 יוסבר בהמשך; כרגע מספיק לומר שאלה שני כוחות שונים.\nחוזרים להצבעה בשקף האחרון.", "steps": 6}, {"id": "s02-force", "title": "מהו כוח וכיצד מייצגים אותו?", "html": "\u003csection id=\"s02-force\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e&#8235;מהו כוח וכיצד מייצגים אותו?&#8236;\u003c/h2\u003e\n\u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTQwIiB2aWV3Qm94PSIwIDAgMTYwIDE0MCI+CjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0idyIgeDE9IjAiIHkxPSIwIiB4Mj0iMCIgeTI9IjEiPjxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iI0UyQjg3OCIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xv משתנה אחד בכל פעם.\nסדר ההקשות: חיזוי בעל פה. הקשה 1: המשוואה הכללית באותיות והכלל: ימינה פלוס, שמאלה מינוס. הקשה 2: מסמנים את F₁: רקע צהוב במשוואה ומסגרת צהובה על התווית שלו בתרשים. שואלים: מה הגודל ומה הכיוון? הקשה 3: מציבים (+4). הקשה 4: מסמנים את F₂. הקשה 5: מציבים (+2). הקשה 6: התוצאה +6 N וחץ השקול. הקשה 7: החץ של יואב מתהפך. הקשה 8: מסמנים שוב את F₂, עכשיו הוא פונה שמאלה. הקשה 9: מציבים (−2). הקשה 10: התוצאה +2 N. הקשה 11: הדגש על גוף K.\nשאלה מכוונת בהקשה 8: מה השתנה במשוואה? רק הסימן של הכוח השני. F₁ נשאר (+4).\nטעות נפוצה: כלל שטחי של תמיד מחברים או תמיד מחסרים. המשוואה היא תמיד חיבור, והסימן נכנס עם המספר.\nבמעבדה, תחנה 1: אותה הצבה צעד אחר צעד, ותרגיל גרירה.", "steps": 11}, {"id": "s05-book", "title": "ספר מונח על שולחן: אילו כוחות פועלים עליו?", "html": "\u003csection id=\"s05-book\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e&#8235;ספר מונח על שולחן: אילו כוחות פועלים עליו?&#8236;\u003c/h2\u003e\n\u003cp data-build-out=\"fade 1\" style=\"position:absolute;left:150px;top:272px;width:740px;font-size:40px;font-weight:700;line-height:1.35;text-align:right;color:#2b2829\"\u003e&#8235;האם פועלים על הספר כוחות?&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"fade 1\" data-build-out=\"fade 2\" style=\"position:absolute;left:150px;top:272px;width:740px;font-size:40px;font-weight:700;line-height:1.35;text-align:right;color:#2b2829\"\u003e&#8235;מה היה קורה לספר אילו פעלה עליו רק משיכת כדור הארץ?&#8236;\u0 /p\u003e\n\u003cdiv data-build-in=\"fade 1\" style=\"position:absolute;left:420px;top:580px;width:20px;height:20px;background:#2b2829;border:3px solid #6f6b6c;border-radius:50%\"\u003e\u003c/div\u003e\n\u003cp data-build-in=\"fade 1\" style=\"position:absolute;left:150px;top:760px;width:560px;font-size:29px;font-weight:600;line-height:1.35;text-align:center;color:#5a5758\"\u003e&#8235;החצים יוצאים מנקודת המגע בין הספר לשולחן&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:212px;top:836px;width:300px;font-size:31px;font-weight:400;line-height:1.35;text-align:left;color:#5a5758\"\u003e&#8235;משבצת אחת = 1N&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"rise 1\" style=\"position:absolute;left:960px;top:262px;width:832px;font-size:36px;font-weight:400;line-height:1.35;text-align:right;color:#2b2829;background:#eaf6fc;border:2px solid #a85f00;border-radius:8px;padding:14px 28px\"\u003e&#8235;\u003cb\u003eמשיכת כדור הארץ:\u003c/b\u003e כדור הארץ מושך אליו כל גוף, גם את הספר. לכן החץ פונה מטה.&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"rise 2\" style=\"position:absolute;left:960px;top:400px;width:832px;font-size:36px;font-weight:400;line-height:1.35;text-align:right;color:#2b2829;background:#eaf6fc;border:2px solid #0072b2;border-radius:8px;padding:14px 28px\"\u003e&#8235;\u003cb\u003eדחיפת השולחן:\u003c/b\u003e הספר מפעיל על השולחן כוח כלפי מטה. השולחן מפעיל על הספר כוח נגדי כלפי מעלה, שנקרא כוח נורמלי.&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"fade 2\" style=\"position:absolute;left:960px;top:574px;width:832px;font-size:31px;font-weight:400;line-height:1.35;text-align:right;color:#5a5758\"\u003e&#8235;דחיפה בניצב למשטח נקראת כוח נורמלי.&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 3\" style=\"position:absolute;left:960px;top:640px;width:832px;font-size:36px;font-weight:400;line-height:1.35;text-align:right;color:#2b2829;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 28px\"\u003e&#8235;\u003cb\u003eהחוק הראשון:\u003c/b\u003e הספר נשאר במנוחה. לכן שני הכוחות עליו שווים בגודלם והפוכים בכיוונם. השקול הוא אפס.&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 4\" style=\"position:absolute;left:960px;top:808px;width:832px;font-size:34px;font-weight:600;line-height:1.35;text-align:right;color:#2b2829;background:#eaf6fc;border:2px solid #0b6a97;border-radius:8px;padding:14px 28px\"\u003e&#8235;שני הכוחות פועלים על הספר. בהמשך נבחין בינם לבין זוג פעולה ותגובה.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:300px;font-size:28px;text-align:left;color:#5a5758\"\u003e6 / 20\u003c/p\u003e\n\u003cp data-lab=\"1\" style=\"position:absolute;left:460px;bottom:58px;width:380px;font-size:28px;font-weight:700;text-align:center;background:#f3f5f6;border:2px solid #0b6a97;border-radius:9999px;padding:2px 0;color:#0b6a97\"\u003e&#8235;\u003ca href=\"../forces-lab/#st2\" style=\"color:#0b6a97\"\u003eבמעבדה: תחנה 2\u003c/a\u003e&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;right:128px;bottom:58px;width:110px;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#a85f00;border-radius:9999px;padding:2px 0\"\u003e&#8235;כוח&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;right:250px;bottom:58px;width:180px;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#0072b2;border-radius:9999px;padding:2px 0\"\u003e&#8235;כוח מנוגד&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;right:442px;bottom:58px;width:170px;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#007a5a;border-radius:9999px;padding:2px 0\"\u003e&#8235;כוח שקול&#8236;\u003c/p\u003e\n\n\u003c/section\u003e\n\n", "notes": "מטרה: לזהות את שני הכוחות שפועלים על הספר, ולהסביר את השוויון ביניהם בעזרת החוק הראשון.\nמינוח: לא משתמשים כאן במונחים \"כוח כובד\" ו\"כוח תמיכה\". אומרים \"כדור הארץ מושך את הספר\" ו\"השולחן דוחף את הספר\". הסימונים F עם g ו-F עם N מופיעים כתוויות. האות N שמתחת ל-F היא חלק משם הכוח, ואילו N אחרי מספר מציינת ניוטון.\nסדר ההקשות: לפני ההקשה הראשונה: ספר על שולחן, בלי חצים. שואלים: האם פועלים על הספר כוחות? הקשה 1: משיכת כדור הארץ, 10 N, ושאלה: אם רק היא הייתה פועלת, מה היה קורה? (הספר היה נופל). הקשה 2: דחיפת השולחן, 10 N, עם ההסבר: הספר והשולחן מפעילים זה על זה כוחות מנוגדים. הכוח הנורמלי הוא הכוח שהשולחן מפעיל על הספר. משקל הספר הוא כוח אחר, שכדור הארץ מפעיל על הספר. הקשה 3: החוק הראשון. הקשה 4: האזהרה.\nשני החצים מצוירים מנקודת המגע בין הספר לשולחן, כמו בספר הלימוד.\nאפשר להדגים: לוחצים בכף היד על ספוג או על קפיץ. מה מרגישים? הספוג דוחף בחזרה. גם השולחן עושה זאת, רק שהוא קשיח ולכן לא רואים את הכיווץ.\nאין שואלים כאן על פעולה ותגובה. את השאלה שומרים לשקף בדיקת ההבנה.", "steps": 4}, {"id": "s06-third", "title": "החוק השלישי של ניוטון", "html": "\u003csection id=\"s06-third\" data-transition=\"fade\" style=\"display:flex;flex-direction:column;gap:24px;padding:128px 128px 160px;background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px\"\u003e\n  \u003ch2 style=\"font-family:Rubik, Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e‫החוק השלישי של ניוטון‬\u003c/h2\u003e\n  \u003cp style=\"position:absolute;top:267.5px;left:150px;width:1600px;font-family:Assistant, Arial, sans-serif;font-size:38px;font-weight:700;line-height:1.25;text-align:right;color:#2b2829\"\u003e‫גוף 1 דוחף את גוף 2. מה עושה גוף 2?‬\u003c/p\u003e\n  \u003cdiv style=\"position:absolute;top:475px;left:330px;width:1260px;height:6px;display:flex;flex-direction:column;background:#6f6b6c;border-radius:8px\"\u003e\n  \u003c/div\u003e\n  \u003cimg src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNjAiIGhlaWdodD0iMTQwIiB2aWV3Qm94PSIwIDAgMTYwIDE0MCI+CjxkZWZzPjxsaW5lYXJHcmF ;font-size:28px;font-weight:700;text-align:center;color:#0b6a97;background:#f3f5f6;border:2px solid #0b6a97;border-radius:9999px\"\u003e‫\u003ca href=\"../forces-lab/#st3\" style=\"color:#0b6a97\"\u003eבמעבדה: תחנה 3\u003c/a\u003e‬\u003c/p\u003e\n  \u003cp style=\"position:absolute;right:128px;bottom:58px;width:110px;padding:2px 0;font-family:Assistant, Arial, sans-serif;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#a85f00;border-radius:9999px\"\u003e‫כוח‬\u003c/p\u003e\n  \u003cp style=\"position:absolute;right:250px;bottom:58px;width:180px;padding:2px 0;font-family:Assistant, Arial, sans-serif;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#0072b2;border-radius:9999px\"\u003e‫כוח מנוגד‬\u003c/p\u003e\n  \u003cp style=\"position:absolute;right:442px;bottom:58px;width:170px;padding:2px 0;font-family:Assistant, Arial, sans-serif;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#007a5a;border-radius:9999px\"\u003e‫כוח שקול‬\u003c/p\u003e\n  \n\u003c/section\u003e\n\n", "notes": "מטרה: להבין שזוג פעולה ותגובה הוא אינטראקציה בין שני גופים שונים. זו ההבחנה החשובה ביותר בשיעור. האינטראקציה היא במגע: שני הגופים צמודים לאורך כל השקף, והפס הצהוב מסמן את משטח המגע. שני החצים מתחילים במשטח המגע. סדר החשיפה: שני הגופים צמודים, ושאלה. הקשה 1: הכוח שגוף 1 מפעיל על גוף 2. החץ הכתום מתחיל במשטח המגע ומצויר על גוף 2. הקשה 2: הכוח הנגדי. החץ התכלת מתחיל באותו משטח, מצויר על גוף 1, ואורכו זהה. הקשה 3: ההגדרה והביטוי המתמטי, בלי תיבת הסבר נוספת על האינדקסים. הקשה 4: משפט המפתח. שני החצים מצוירים בגבהים מעט שונים רק כדי שלא יסתירו זה את זה. במציאות שניהם פועלים באותו משטח. שאלה לתלמידים: על איזה גוף מצויר כל חץ? סימון: F⃗ עם האינדקס 1,2 הוא הכוח שגוף 1 מפעיל על גוף 2. המספר הראשון הוא מי מפעיל, והשני על מי. דיוק: אין לומר שהכוחות לעולם אינם מתבטלים. בחישוב על מערכת של שני הגופים יחד הם כוחות פנימיים ומתבטלים. בחישוב על גוף יחיד לא מחברים אותם.", "steps": 4}, {"id": "s07a-ball", "title": "דוגמה: כדור פוגע בא es": "שקף מעבר עם הנפשת תנועה. במצב הקרנה, במעבר לשקף הבא הכדור עף ימינה עד היד. זו הנפשת מעבר מסוג הזזה (magic move): הכדור והאדם נושאים אותו מזהה בשני השקפים.\nמבקשים חיזוי לשלוש השאלות לפני ההקשה. לא מאשרים ולא פוסלים תשובות. התשובות נבנות בשקף הבא.\nבמעבדה, תחנה 4: אותה פגיעה כהנפשה מלאה, כולל הקפאה ברגע המגע וגרירת תוויות.", "steps": 0}, {"id": "s07-ball", "title": "דוגמה: כדור פוגע באדם", "html": "\u003csection id=\"s07-ball\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e&#8235;דוגמה: כדור פוגע באדם&#8236;\u003c/h2\u003e\n\u003cp data-build-out=\"fade 2\" style=\"position:absolute;left:160px;top:272px;width:716px;font-size:38px;font-weight:700;line-height:1.35;text-align:right;color:#2b2829\"\u003e&#8235;ברגע המגע, על מי הכדור מפעיל כוח ולאיזה כיוון?&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"fade 2\" style=\"position:absolute;left:160px;top:272px;width:716px;font-size:38px;font-weight:700;line-height:1.35;text-align:right;color:#2b2829\"\u003e&#8235;על מי האדם מפעיל כוח ולאיזה כיוון?&#8236;\u003c/p\u003e\n\u003cimg id=\"personobj\" src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iNDIwIiB2aWV3Qm94PSIwIDAgMjAwIDQyMCI+CjxlbGxpcHNlIGN4PSIxMDAiIGN5PSI0MDgiIHJ4PSI3OCIgcnk9IjkiIGZpbGw9IiMxNDFCNEQiIG9wYWNpdHk9IjAuMTIiLz4KPHBhdGggZD0iTTc4IDI1MEw3MCAzOTIiIHN0cm9rZT0iIzJCMzU2MCIgc3Ryb2tlLXdpZHRoPSIzNCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+CjxwYXRoIGQ9Ik u003e\n\n\u003c/section\u003e\n\n", "notes": "בגרסת הדפדפן גוררים ישירות בשקף. Ctrl+Z מבטל גרירה. הכפתור \"התחלה מחדש\" מאפס את השקף.\n\nשקף סדנה, רשות. התלמידים מרכיבים בעצמם את החיבור הווקטורי ואת המשוואה.\nאיך מפעילים: יוצאים מההקרנה למצב עריכה. תלמיד גורר חלקים על הלוח החכם או במחשב. כל חץ וכל אריח הם רכיב נפרד.\nמשימה 1, חצים: להעתיק את החץ המקווקו האופקי אל קצה החץ של 4 ניוטון, ואת המקווקו האנכי אל קצה החץ של 2 ניוטון, כך שנוצר מלבן. אחר כך לבחור את חץ השקול הנכון מבין שלושת הירוקים ולהניח אותו מהארגז אל הפינה הנגדית. האלכסוני נכון. האופקי הארוך (6 משבצות) מתאים לכוחות באותו כיוון, והאנכי הקצר (2 משבצות) לכוחות מנוגדים.\nמשימה 2, משוואה: לסדר במסגרת את האריחים כך: |ΣF⃗| ואחריו = √ ואחריו 4² + 2² ולבסוף ≈ 4.47 N. האריחים המיותרים: סימן המינוס, 4, 2, והתוצאות 6 N ו-2 N. שואלים למה כל אחד מהם לא מתאים.\nאחרי הפעילות: Ctrl+Z מחזיר את החלקים. מומלץ לשכפל את השקף לפני השיעור ולעבוד על העותק.", "steps": 0}, {"id": "s11b-angle", "title": "שני חוטים מושכים סירה", "html": "\u003csection id=\"s11b-angle\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e&#8235;שני חוטים מושכים סירה&#8236;\u003c/h2\u003e\n\u003cdiv style=\"position:absolute;left:128px;top:250px;width:1000px;height:650px;background:#f3f5f6;border:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cx-embed style=\"position:absolute;left:128px;top:250px;width:1000px;height:650px\"\u003e\u003ccanvas id=\"c\" width=\"1000\" height=\"650\" sty \n\u003cp style=\"position:absolute;right:128px;bottom:58px;width:110px;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#a85f00;border-radius:9999px;padding:2px 0\"\u003e&#8235;כוח&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;right:250px;bottom:58px;width:180px;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#0072b2;border-radius:9999px;padding:2px 0\"\u003e&#8235;כוח מנוגד&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;right:442px;bottom:58px;width:170px;font-size:28px;font-weight:700;text-align:center;color:#ffffff;background:#007a5a;border-radius:9999px;padding:2px 0\"\u003e&#8235;כוח שקול&#8236;\u003c/p\u003e\n\n\u003c/section\u003e\n\n", "notes": "שקף הרחבה, אפשר לדלג עליו. מטרה: לראות ששלושת המצבים שלמדנו הם נקודות על רצף אחד, ושהכיוון היחסי בין הכוחות קובע את גודל השקול.\nההנפשה רצה מעצמה: הזווית עוברת מ-0 ל-90 ול-180 מעלות ונעצרת לרגע בכל אחת מהן. היא פועלת רק בהקרנה מהדפדפן. בייצוא ל-PowerPoint או ל-PDF היא הופכת לתמונה.\nשאלה לתלמידים לפני ההקשה: עצרו אותי כשהשקול הכי גדול. למה דווקא שם?\nהקשה 1: שלוש נקודות העצירה. הקשה 2: בניית המקבילית והאלכסון השקול, בתיבה נפרדת מתחת לתשובות.\nדיוק: בזוויות שאינן 0, 90 או 180 מעלות לא מחשבים בכיתה ח׳. פיתגורס מתאים רק לזווית ישרה. כאן רק צופים ומסיקים.\nהקווים המקווקווים הם בנייה גאומטרית (מקבילית), לא כוחות.", "steps": 2}, {"id": "s12-summary", "title": "סיכום: הכיוון משנה את השקול", "html": "\u003csection id=\"s12-summary\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font- =\"font-size:36px;line-height:1.3;text-align:right;color:#2b2829\"\u003e&#8235;האם שני הכוחות בכל תרשים פועלים על אותו גוף?&#8236;\u003c/p\u003e\n\u003cp style=\"font-size:36px;line-height:1.3;text-align:right;color:#2b2829\"\u003e&#8235;האם הכוחות באחד התרשימים הם זוג פעולה ותגובה? נמקו.&#8236;\u003c/p\u003e\n\u003c/div\u003e\n\u003cp data-build-in=\"fade 3\" style=\"position:absolute;left:128px;top:856px;width:1664px;font-size:38px;font-weight:700;line-height:1.3;text-align:right;background:#eaf6fc;border-radius:8px;padding:18px 32px;color:#2b2829\"\u003e&#8235;לחישוב השקול מחברים כוחות על אותו גוף. בזוג פעולה ותגובה כל גוף מפעיל כוח על האחר.&#8236;\u003c/p\u003e\n\u003cp data-val=\"1\" style=\"position:absolute;left:1572px;top:410px;width:80px;font-family:'Rubik', 'Heebo', system-ui, sans-serif;font-size:27px;font-weight:500;text-align:left;color:#a85f00\"\u003e&#8206;4 N&#8206;\u003c/p\u003e\n\u003cp data-val=\"1\" style=\"position:absolute;left:1512px;top:455px;width:80px;font-family:'Rubik', 'Heebo', system-ui, sans-serif;font-size:27px;font-weight:500;text-align:left;color:#a85f00\"\u003e&#8206;2 N&#8206;\u003c/p\u003e\n\u003cp data-val=\"1\" data-build-in=\"fade 1\" style=\"position:absolute;left:1518px;top:525px;width:90px;font-family:'Rubik', 'Heebo', system-ui, sans-serif;font-size:27px;font-weight:500;text-align:left;color:#007a5a\"\u003e&#8206;6 N&#8206;\u003c/p\u003e\n\u003cp data-val=\"1\" style=\"position:absolute;left:1147px;top:410px;width:80px;font-family:'Rubik', 'Heebo', system-ui, sans-serif;font-size:27px;font-weight:500;text-align:left;color:#a85f00\"\u003e&#8206;4 N&#8206;\u003c/p\u003e\n\u003cp data-val=\"1\" style=\"position:absolute;left:756px;top:455px;width:80px;font-family:'Rubik', 'Heebo', system-ui, sans-serif;font-size:27px;font-weight:500;text-align:right;color:#0072b2\"\u003e&#8206;2 N&#8206;\u003c/p\u003e\n\u003cp data-val=\"1\" data-build-in=\"fade 1\" style=\"position:absolute;left:973px;top:525px;width:80px;font-family:'Rubik' קול, קווי המקבילית המקווקווים בתרשים המאונך ושלוש התוצאות. הקשה 2: שאלות הסיכום. הקשה 3: משפט המפתח.\nתשובות צפויות: הכיוון היחסי בין הכוחות קובע את אופן חיבורם הווקטורי. בכל שלוש הדוגמאות מחברים כוחות על אותו גוף. אף אחת מהן אינה מציגה זוג פעולה ותגובה.\nחוזרים להצבעה בשקף 1: האם אפשר לחשב את הכוח השקול באותה דרך בכל שלושת המצבים? ושואלים אם התשובה השתנתה.", "steps": 3}, {"id": "x1-traps", "title": "ארבע טעויות נפוצות: בדקו והסבירו", "html": "\u003csection id=\"x1-traps\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e&#8235;ארבע טעויות נפוצות: בדקו והסבירו&#8236;\u003c/h2\u003e\n\u003cdiv style=\"position:absolute;left:976px;top:240px;width:816px;height:310px;background:#f3f5f6;border:1px solid #d5d8db;border-top:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cdiv style=\"position:absolute;left:128px;top:240px;width:816px;height:310px;background:#f3f5f6;border:1px solid #d5d8db;border-top:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cdiv style=\"position:absolute;left:976px;top:570px;width:816px;height:310px;background:#f3f5f6;border:1px solid #d5d8db;border-top:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cdiv style=\"position:absolute;left:128px;top:570px;width:816px;height:310px;background:#f3f5f6;border:1px solid #d5d8db;border-top:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cp style=\"position:absolute;left:1000px;top:268px;width:768px;font-size:40px;font-weight:700;line-height:1.3;text-align:right;color:#b3261e\"\u003e&#8235;\"הכוחות שווים ומנוגדים, אז הם מתבטלים\"&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 1\" style=\"position:absolute;left:1000px;top:376px;width:768px;font-size:38px;line-height:1.35;text-align:right;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 20px;color:#2b2829\"\u003e&#8235;שני כוחות שווים והפוכים נותנים שקול אפס על אותו גוף. בזוג פעולה ותגובה כל כוח פועל על גוף אחר.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:152px;top:268px;width:768px;font-size:40px;font-weight:700;line-height:1.3;text-align:right;color:#b3261e\"\u003e&#8235;\"הגוף הגדול מפעיל כוח גדול יותר\"&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 2\" style=\"position:absolute;left:152px;top:376px;width:768px;font-size:38px;line-height:1.35;text-align:right;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 20px;color:#2b2829\"\u003e&#8235;הכוחות שהגופים מפעילים זה על זה שווים בגודלם. השינוי בתנועה עשוי להיות שונה בכל גוף.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:1000px;top:598px;width:768px;font-size:40px;font-weight:700;line-height:1.3;text-align:right;color:#b3261e\"\u003e&#8235;\"כוח שקול אפס אומר שאין כוחות\"&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 3\" style=\"position:absolute;left:1000px;top:706px;width:768px;font-size:38px;line-height:1.35;text-align:right;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 20px;color:#2b2829\"\u003e&#8235;גם כשיש כוחות, השקול יכול להיות אפס. כך קורה כשספר נשאר במנוחה על שולחן.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:152px;top:598px;width:768px;font-size:40px;font-weight:700;line-height:1.3;text-align:right;color:#b3261e\"\u003e&#8235;\"כוחות מחברים כמו מספרים רגילים\"&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 4\" style=\"position:absolute;left:152px;top:706px;width:768px;font-size:38px;line-height:1.35;text-align:right;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 20px;color:#2b2829\"\u003e&#8235;באותו כיוון מחברים גדלים. בכיוונים מנוגדים מחסרים. בזווית ישרה משתמשים במשפט פיתגורס.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:300px;font-size:28px;text-align:left;color:#5a5758\"\u003e17 / 20\u003c/p\u003e\n\n\u003c/section\u003e\n\n", "notes": "מטרה: לקרוא בשם לארבעת הקשיים הנפוצים בנושא, ולתת לכל אחד תיקון קצר.\nהפעלה: מקריאים מלכודת, שואלים \"מה לא נכון כאן?\", ורק אחרי תשובות חושפים את התיקון בהקשה. מלכודת אחת בכל הקשה.\nמקור הקושי בכל מלכודת:\n1. בלבול בין כוח שקול לחוק השלישי. שני המצבים נראים זהים בתרשים: שני חצים שווים ומנוגדים. ההבדל היחיד הוא על כמה גופים הם מצוירים. השאלה שמתירה: על איזה גוף פועל כל כוח?\n2. אינטואיציה מהחיים: מי שנפגע יותר, כנראה קיבל כוח גדול יותר. התלמידים מבלבלים בין הכוח לבין התוצאה שלו. אותו כוח גורם לתאוצה גדולה בגוף קל ולתאוצה קטנה בגוף כבד.\n3. בלבול בין \"אין כוחות\" לבין \"הכוחות מאוזנים\". הספר שעל השולחן הוא דוגמת העוגן.\n4. הרגל מחשבון: חיבור גדלים בלי להתחשב בכיוון. גם ההפך קורה: שימוש בפיתגורס כשהכוחות אינם מאונכים.\nקושי נוסף שלא מופיע בשקף: סימן שלילי. תלמידים חושבים שגודל של כוח יכול להיות שלילי. הסימן מתאר כיוון בלבד, והגודל תמיד אינו שלילי.", "steps": 4}, {"id": "x2-riddles", "title": "חידות: החוק השלישי", "html": "\u003csection id=\"x2-riddles\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e&#8235;חידות: החוק השלישי&#8236;\u003c/h2\u003e\n\u003cdiv style=\"position:absolute;left:128px;top:240px;width:1664px;height:320px;background:#f3f5f6;border:1px solid #d5d8db;border-top:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cdiv style=\"position:absolute;left:128px;top:580px;width:1664px;height:320px;background:#f3f5f6;border:1px solid #d5d8db;border-top:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cp style=\"position:absolute;left:160px;top:266px;width:1600px;font-size:43px;font-weight:700;line-height:1.3;text-align:right;color:#2b2829\"\u003e&#8235;סוס מושך עגלה והיא מתחילה לנוע. העגלה מושכת את הסוס בכוח שווה והפוך. מדוע שני הכוחות האלה אינם יוצרים שקול אפס על העגלה?&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 1\" style=\"position:absolute;left:160px;top:386px;width:1600px;font-size:38px;line-height:1.35;text-align:right;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 24px;color:#2b2829\"\u003e&#8235;הסוס מושך את העגלה, והעגלה מושכת את הסוס. רק משיכת הסוס פועלת על העגלה. כדי שתתחיל לנוע, המשיכה צריכה לגבור על הכוחות שמתנגדים לתנועתה.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:160px;top:606px;width:1600px;font-size:43px;font-weight:700;line-height:1.3;text-align:right;color:#2b2829\"\u003e&#8235;הזבוב והמשאית: זבוב מתנגש בשמשה של משאית נוסעת. על מי פועל כוח גדול יותר?&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 2\" style=\"position:absolute;left:160px;top:726px;width:1600px;font-size:38px;line-height:1.35;text-align:right;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 24px;color:#2b2829\"\u003e&#8235;הזבוב והשמשה מפעילים זה על זה כוחות שווים בגודלם. לזבוב מסה קטנה מאוד, ולכן תנועתו משתנה הרבה יותר מתנועת המשאית.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:300px;font-size:28px;text-align:left;color:#5a5758\"\u003e18 / 20\u003c/p\u003e\n\u003cp data-lab=\"1\" style=\"position:absolute;left:460px;bottom:58px;width:380px;font-size:28px;font-weight:700;text-align:center;background:#f3f5f6;border:2px solid #0b6a97;border-radius:9999px;padding:2px 0;color:#0b6a97\"\u003e&#8235;\u003ca href=\"../forces-lab/#st6\" style=\"color:#0b6a97\"\u003eבמעבדה: תחנה 6\u003c/a\u003e&#8236;\u003c/p\u003e\n\n\u003c/section\u003e\n\n", "notes": "שתי חידות קלאסיות על החוק השלישי. חושבים בזוגות דקה, ורק אז חושפים.\nהסוס והעגלה: הקושי הוא שהתלמידים מחברים שני כוחות שפועלים על גופים שונים. מבקשים מהם לבחור גוף אחד, העגלה, ולשאול אילו כוחות פועלים עליה בלבד: משיכת הסוס קדימה והחיכוך לאחור. הכוח שהעגלה מפעילה על הסוס אינו חלק מהחשבון הזה, כי הוא פועל על הסוס.\nהזבוב והמשאית: הקושי הוא הבלבול בין גודל הכוח לבין תוצאתו. הכוחות שווים לפי החוק השלישי. הנזק שונה כי המסות שונות מאוד.\nשאלת המשך: מה הייתם משרטטים בתרשים הכוחות של הזבוב בלבד?", "steps": 2}, {"id": "x3-riddles", "title": "חידות: כוח שקול", "html": "\u003csection id=\"x3-riddles\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e&#8235;חידות: כוח שקול&#8236;\u003c/h2\u003e\n\u003cdiv style=\"position:absolute;left:128px;top:240px;width:1664px;height:320px;background:#f3f5f6;border:1px solid #d5d8db;border-top:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cdiv style=\"position:absolute;left:128px;top:580px;width:1664px;height:320px;background:#f3f5f6;border:1px solid #d5d8db;border-top:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cp style=\"position:absolute;left:160px;top:266px;width:1600px;font-size:43px;font-weight:700;line-height:1.3;text-align:right;color:#2b2829\"\u003e&#8235;שני כוחות של 5N פועלים על גוף אחד. האם הכוח השקול יכול להיות אפס? ומה לגבי 10N? ובערך 7N?&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 1\" style=\"position:absolute;left:160px;top:386px;width:1600px;font-size:38px;line-height:1.35;text-align:right;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 24px;color:#2b2829\"\u003e&#8235;כל שלוש האפשרויות נכונות. בכיוונים הפוכים: אפס. באותו כיוון: 10N. בזווית ישרה מחשבים במשפט פיתגורס ומקבלים כ־7.07N.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:160px;top:606px;width:1600px;font-size:43px;font-weight:700;line-height:1.3;text-align:right;color:#2b2829\"\u003e&#8235;תלמיד כתב: כוח של 3N ועוד כוח של 4N נותנים תמיד 7N. מתי הוא צודק ומתי הוא טועה?&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"pop 2\" style=\"position:absolute;left:160px;top:726px;width:1600px;font-size:38px;line-height:1.35;text-align:right;background:#eaf6fc;border:2px solid #007a5a;border-radius:8px;padding:14px 24px;color:#2b2829\"\u003e&#8235;התוצאה 7N נכונה כשהכוחות באותו כיוון. בכיוונים הפוכים מתקבל 1N, ובזווית ישרה 5N. הגודל תלוי בזווית, ונע בין 1N ל־7N.&#8236;\u003c/p\u003e\n\u003cp style=\"position:absolute;left:128px;bottom:64px;width:300px;font-size:28px;text-align:left;color:#5a5758\"\u003e19 / 20\u003c/p\u003e\n\u003cp data-lab=\"1\" style=\"position:absolute;left:460px;bottom:58px;width:380px;font-size:28px;font-weight:700;text-align:center;background:#f3f5f6;border:2px solid #0b6a97;border-radius:9999px;padding:2px 0;color:#0b6a97\"\u003e&#8235;\u003ca href=\"../forces-lab/#st6\" style=\"color:#0b6a97\"\u003eבמעבדה: תחנה 6\u003c/a\u003e&#8236;\u003c/p\u003e\n\n\u003c/section\u003e\n\n", "notes": "שתי חידות על חיבור וקטורי. שתיהן תוקפות את ההרגל לחבר גדלים בלי להתחשב בכיוון.\nחידה ראשונה: מבקשים מהתלמידים לשרטט במחברת שלושה תרשימים, אחד לכל תוצאה. מי שמשרטט מבין מהר יותר ממי שמחשב.\nחידה שנייה: שלשת 3, 4, 5 מאפשרת חישוב בלי מחשבון. שואלים: מה השקול הקטן ביותר האפשרי? ומה הגדול ביותר? כך מגיעים לרעיון שהשקול נע בטווח, והכיוון היחסי קובע היכן.\nקישור לשקף הסירה: שם ראינו את אותו רעיון עם 4 ו-2 ניוטון, בטווח שבין 2 ל-6.", "steps": 2}, {"id": "s13-exit", "title": "בדיקה לסיום: פתרו והסבירו", "html": "\u003csection id=\"s13-exit\" data-transition=\"fade\" style=\"background-color:#ffffff;background-image:linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px),linear-gradient(#ffffff00 1px,transparent 1px),linear-gradient(90deg,#ffffff00 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:#2b2829;font-family:'Assistant', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:24px\"\u003e\n\u003ch2 style=\"font-family:'Rubik', Arial, sans-serif;font-size:63px;font-weight:600;line-height:1.15;text-align:right;color:#2b2829\"\u003e&#8235;בדיקה לסיום: פתרו והסבירו&#8236;\u003c/h2\u003e\n\u003cdiv data-build-in=\"rise 0\" style=\"position:absolute;left:1272px;top:240px;width:520px;height:600px;background:#f3f5f6;border:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cp data-build-in=\"rise 0\" style=\"position:absolute;left:1292px;top:264px;width:480px;font-size:38px;line-height:1.3;text-align:right;font-weight:700;color:#2b2829\"\u003e&#8235;שאלה 1: כוחות מנוגדים&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"rise 0\" style=\"position:absolute;left:1292px;top:322px;width:480px;font-size:34px;line-height:1.3;text-align:right;font-weight:400;color:#5a5758\"\u003e&#8235;על גוף אחד פועלים 4N שמאלה ו־2N ימינה. מהו השקול?&#8236;\u003c/p\u003e\n\u003cdiv data-build-in=\"rise 1\" style=\"position:absolute;left:1477px;top:438px;width:110px;height:100px;background:#eaf6fc;border:3px solid #6f6b6c;border-radius:8px;display:flex;align-items:center;justify-content:center\"\u003e\u003c/div\u003e\n\u003cx-connector data-build-in=\"fade 1\" x1=\"1591\" y1=\"468\" x2=\"1651\" y2=\"468\" style=\"color:#a85f00;border-width:8px;\"\u003e\u003c/x-connector\u003e\n\u003cx-connector data-build-in=\"fade 1\" x1=\"1473\" y1=\"508\" x2=\"1353\" y2=\"508\" style=\"color:#0072b2;border-width:8px;\"\u003e\u003c/x-connector\u003e\n\u003cp data-build-in=\"rise 1\" dir=\"ltr\" style=\"position:absolute;left:1657px;top:447px;width:90px;font-size:28px;line-height:1.3;text-align:center;font-weight:400;color:#a85f00\"\u003e&#8206;2 N&#8206;\u003c/p\u003e\n\u003cp data-build-in=\"rise 1\" dir=\"ltr\" style=\"position:absolute;left:1360px;top:528px;width:90px;font-size:28px;line-height:1.3;text-align:center;font-weight:400;color:#0072b2\"\u003e&#8206;4 N&#8206;\u003c/p\u003e\n\u003cx-connector data-build-in=\"fade 2\" x1=\"1587\" y1=\"596\" x2=\"1527\" y2=\"596\" style=\"color:#007a5a;border-width:8px;\"\u003e\u003c/x-connector\u003e\n\u003cp data-build-in=\"rise 2\" dir=\"ltr\" style=\"position:absolute;left:1292px;top:636px;width:480px;font-size:32px;line-height:1.3;text-align:center;font-weight:400;color:#007a5a\"\u003e&#8206;ΣFₓ = −4 N + 2 N = −2 N&#8206;\u003c/p\u003e\n\u003cp data-build-in=\"rise 3\" style=\"position:absolute;left:1292px;top:700px;width:480px;font-size:34px;line-height:1.3;text-align:right;font-weight:700;color:#007a5a\"\u003e&#8235;בחרנו ימינה כחיובי. המינוס מציין שמאלה. גודל השקול הוא 2N.&#8236;\u003c/p\u003e\n\u003cdiv data-build-in=\"rise 4\" style=\"position:absolute;left:700px;top:240px;width:520px;height:600px;background:#f3f5f6;border:1px solid #d5d8db;border-radius:8px\"\u003e\u003c/div\u003e\n\u003cp data-build-in=\"rise 4\" style=\"position:absolute;left:720px;top:264px;width:480px;font-size:38px;line-height:1.3;text-align:right;font-weight:700;color:#2b2829\"\u003e&#8235;שאלה 2: כוחות מאונכים&#8236;\u003c/p\u003e\n\u003cp data-build-in=\"rise 4\" style=\"position:absolute;left:720px;top:322px;width:480px;font-size:34px;line-height:1.3;text-align:right;font-weight:400;color:#5a5758\"\u003e&#8235;על גוף אחד פועלים 3N למעלה ו־4N ימינה. מהו השקול?&#8236;\u003c/p\u003e\n\u003cdiv data-build-in=\"rise 5\" style=\"position:absolute;left:845px;top:510px;width:110px;height:90px;background:#eaf6fc;border:3px solid #6f6b6c;border-radius:8px;display:flex;align-items:center;justify-content:center\"\u003e\u003c/div\u003e\n\u003cx-connector data-build-in=\"fade 5\" x1=\"900\" y1=\"555\" x2=\"900\" y2=\"465\" style=\"color:#a85f00;border-width:8px;\"\u003e\u003c/x-connector\u003e\n\u003cx-connector data-build-in=\"fade 5\" x1=\"900\" y1=\"555\" x2=\"1020\" y2=\"555\" style=\"color:#a85f00;border-width:8px;\"\u003e\u003c/x-connector\u003e\n\u003cp data-build-in=\"rise 5\" dir=\"ltr\" style=\"position:absolute;left:801px;top:466px;width:90px;font-size:28px;line-height:1.3;text-align:center;font-weight:400;color:#a85f00\"\u003e&#8206;3 N&#8206;\u003c/p\u003e\n\u003cp data-build-in=\"rise 5\" dir=\"ltr\" style=\"position:absolute;left:966px;top:575px;width:90px;font-size:28px;line-height:1.3;text-align:center;font-weight:400;color:#a85f00\"\u003e&#8206;4 N&#8206;\u003c/p\u003e\n\u003cx-connector data-build-in=\"fade 6\" head=\"none\" x1=\"900\" y1=\"465\" x2=\"1020\" y2=\"465\" style=\"color:#5a5758;border-width:4px;border-style:dashed\"\u003e\u003c/x-connector\u003e\n\u003cx-connector data-build-in=\"fade 6\" head=\"none\" x1=\"1020\" y1=\"555\" x2=\"1020\" y2=\"465\" style=\"color:#5a5758;border-width:4px;border-style:dashed\"\u003e\u003c/x-connector\u003e\n\u003cx-connector data-build-in=\"fade 7\" x1=\"900\" y1=\"555\" x2=\"1020\" y2=\"465\" style=\"color:#007a5a;border-width:8px;\"\u003e\u003c/x-connector\u003e\n\u003cp data-build-in=\"rise 7\" dir=\"ltr\" style=\"position:absolute;left:720px;top:636px;width:480px;font-size:31px;line-height:1.3;text-align:center;font-weight:400;color:#007a5a\"\u003e&#8206;|ΣF| = √((3 N)² + (4 N)²)\u003cbr\u003e= √(25 N²) = 5 N&#8206;\u003c/p\u003e\n\u003cp data-build-in=\"rise 8\" style=\"position:absolute;lef
